        ${r.initiatives.filter((x) => x.wave_id === w.id).map((x) => `<div class="card" style="padding:8px 10px;margin-top:8px;border-left:3px solid ${WAVE[i]}"><div style="display:flex;gap:6px;align-items:center"><span class="id">${x.id}</span><b class="trunc" style="flex:1;font-size:12.5px;font-weight:500">${esc(x.name)}</b>${ex(x.explain)}</div>
          <div class="xs mut" style="margin-top:3px">Size ${x.size} · ${x.gaps} gaps · priority ${x.priority}${x.foundation ? ' · foundation' : ''}</div><div class="xs num" style="margin-top:2px;font-weight:600">${cr(x.cost_cr)}</div>${x.depends_on.length ? `<div class="xs mut">after ${x.depends_on.join(', ')}</div>` : ''}</div>`).join('')}</div>`).join('')}</div>`, { id: 'sv-roadmap', action: readonly('✦ Initiative briefs') })
      + `<div class="g12" id="sv-budget"><div class="c8">${card(`Indicative budget by financial year ${ex(r.explain.fy_budget)}`, `Low–high range from the rate card, split across FYs by wave. ${esc(r.rate_card_note)}`, Object.entries(r.fy_budget).map(([y, [lo, hi]]) => `<div style="display:grid;grid-template-columns:60px 1fr 120px;gap:10px;align-items:center;margin:8px 0"><b class="sm">${y}</b><div style="position:relative;height:16px;background:var(--soft);border-radius:4px"><i style="position:absolute;left:0;top:0;bottom:0;width:${(hi / fyMax) * 100}%;background:${tint(C.navy, 0.25)};border-radius:4px"></i><i style="position:absolute;left:0;top:0;bottom:0;width:${(lo / fyMax) * 100}%;background:${C.navy};border-radius:4px"></i></div><span class="sm num" style="text-align:right">₹${lo.toFixed(1)}–${hi.toFixed(1)} Cr</span></div>`).join('') + `<div class="sm" style="text-align:right;font-weight:600">Total ${cr(r.total_cr)}</div>`, { action: `<span class="kv" style="font-size:18px">${cr(r.total_cr)}</span>` })}</div>
        <div class="c4">${card('Rate card', '₹ Cr one-time, by initiative size. Editable.', table(['Size', ['Low', 'r'], ['High', 'r']], Object.entries(r.rate_card).map(([k, [lo, hi]]) => `<tr><td><b>${k}</b></td><td class="r"><span class="fld"><span class="in num" style="display:inline-block;width:60px;text-align:right;min-height:24px;padding:2px 6px">${lo}</span></span></td><td class="r"><span class="fld"><span class="in num" style="display:inline-block;width:60px;text-align:right;min-height:24px;padding:2px 6px">${hi}</span></span></td></tr>`)), { action: readonly('Save') })}</div></div>`
      + card('Gap register', `${r.gaps.length} gaps from Phases B–D and governance · priority = impact × urgency · §27`, table(['Gap', 'Kind', 'ADM', ['Impact', 'r'], ['Urgency', 'r'], ['Priority', 'r'], 'Initiative'], r.gaps.map((g) => `<tr><td style="max-width:420px"><div class="trunc" style="font-weight:500">${esc(g.title)}</div><div class="xs mut">${g.id}</div></td><td class="sm mut" style="text-transform:capitalize">${g.kind}</td><td class="xs mut">${g.adm_phase.replace('_', ' ')}</td><td class="r num">${g.impact}</td><td class="r num">${g.urgency}</td><td class="r">${ex(g.explain)} ${prio(g.priority)}</td><td class="sm"><span class="id">${g.theme}</span> ${esc(g.theme_name)}</td></tr>`), 'tall'), { id: 'sv-gaps', action: readonly('⬇ Export') });
  } else {
    body = `<div class="g12" id="sv-governance"><div class="c5">${card(`ACMM profile ${ex(r.explain.acmm_mean)}`, `Architecture Capability Maturity · §51.3 · mean ${r.acmm_mean.toFixed(2)} / 5`, radar(r.acmm))}</div>
      <div class="c7">${card('Element levels', 'Level ≤ 1 raises a 4×4 gap, level 2 a 3×3 gap. Seed levels are assumed.', r.acmm.map((e) => `<div style="display:grid;grid-template-columns:220px 1fr 70px;gap:10px;align-items:center;margin:6px 0"><span class="sm trunc">${esc(e.name)}</span><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:3px">${[0, 1, 2, 3, 4, 5].map((l) => `<span title="${esc(r.acmm_levels[l])}" style="height:20px;border-radius:4px;font-size:10.5px;display:grid;place-items:center;${l === e.level ? `background:${e.level <= 1 ? C.crit : e.level === 2 ? C.dev : C.strong};color:#fff;font-weight:700` : 'background:var(--soft);color:#94A3B8'}">${l}</span>`).join('')}</div>${badge(e.source)}</div>`).join(''))}</div></div>
      <div class="g12"><div class="c5">${card('🧑‍🤝‍🧑 Architecture Review Board', `Charter · §47 · ${r.arb.togaf_ref.map((x) => '§' + x).join(' ')}`, `<div class="sm"><b>Chair:</b> ${esc(r.arb.chair)}</div><div class="sm" style="margin-top:4px"><b>Members:</b></div><ul class="sm" style="margin:2px 0;padding-left:18px">${r.arb.members.map((m) => `<li>${esc(m)}</li>`).join('')}</ul><div class="sm"><b>Cadence:</b> ${esc(r.arb.cadence)}</div>`, { style: 'height:100%' })}</div>
        <div class="c4">${card('⚖ Review checkpoints', 'Implementation governance · Phase G', `<ol class="sm" style="margin:0;padding-left:18px">${r.arb.checkpoints.map((c) => `<li style="margin:4px 0">${esc(c)}</li>`).join('')}</ol>`, { style: 'height:100%' })}</div>
        <div class="c3">${card('Compliance levels', `§${r.compliance_ref} architecture compliance`, r.compliance_levels.map((c) => `<div class="mchip" style="display:flex;margin:4px 0;padding:3px 8px">${esc(c)}</div>`).join(''), { style: 'height:100%' })}</div></div>`
      + card('Decision log', 'Architecture decisions with the principles they rely on · §47, §50', table(['#', 'Decision', 'Principles', 'Status', 'Source', ''], r.decisions.map((x) => `<tr><td class="id">${x.id}</td><td style="max-width:640px"><div style="font-weight:500">${esc(x.title)}</div><div class="xs mut">${esc(x.context)}</div><div class="sm">${esc(x.decision)}</div></td><td>${x.principles.map((p) => `<span class="tag">${p}</span>`).join(' ')}</td><td>${pill(C.dev, x.status)}</td><td>${badge(x.source)}</td><td class="xs mut">✎ 🗑</td></tr>`)), { action: readonly('+ Add decision') });
  }
  return header('roadmap') + summary('roadmap', S.v.roadmap, `${r.kpis.gaps} gaps → ${r.kpis.initiatives} initiatives in ${r.waves.length} waves · ${cr(r.kpis.total_cr)} indicative · ${r.decisions.length} decisions logged`)
    + `<div class="kpis">${kpi('Gaps in register', r.kpis.gaps, `${r.gaps.filter((g) => g.priority >= 20).length} at priority ≥ 20`, C.crit, r.explain.gaps)}
      ${kpi('Initiatives', r.kpis.initiatives, `${r.initiatives.filter((i) => i.foundation).length} foundation themes · 4 waves`, C.navy, r.explain.initiatives)}
      ${kpi('Investment range', cr(r.kpis.total_cr), 'Indicative, rate-card based, not a quote', C.navy, r.explain.total_cr)}
      ${kpi('ACMM mean', `${r.kpis.acmm_mean.toFixed(2)}<small> / 5</small>`, '9 elements · §51.3', r.kpis.acmm_mean < 2 ? C.weak : C.dev, r.explain.acmm_mean)}</div>`
    + tabs('roadmap', [['roadmap', 'Roadmap'], ['governance', 'Governance']], tab) + body + findings('roadmap');
}

// ---------------------------------------------------------------- explain popover, drawer, coach
function explainBody(x) {
  return `<div class="h"><div><small>How this is calculated</small><b>${esc(x.title)}</b></div>${x.ref ? `<span class="tag" style="height:fit-content">TOGAF ${esc(x.ref)}</span>` : ''}</div>
   ${x.lines.length ? `<div class="ln"><table>${x.lines.map((l) => `<tr><td>${esc(l.label)}</td><td style="font-weight:500">${esc(l.value)}</td></tr>`).join('')}</table></div>` : ''}
   <div class="res">${esc(x.result)}</div>${x.rule ? `<div class="rule"><b style="color:var(--fg)">Rule. </b>${esc(x.rule)}</div>` : ''}`;
}
let popEl = null;
function closePop() { if (popEl) { popEl.remove(); popEl = null; } }
function openPop(btn, x) {
  closePop(); popEl = document.createElement('div'); popEl.className = 'pop'; popEl.innerHTML = explainBody(x);
  document.body.appendChild(popEl); const r = btn.getBoundingClientRect();
  let left = r.left + window.scrollX, top = r.bottom + window.scrollY + 6;
  if (left + 430 > window.scrollX + window.innerWidth) left = window.scrollX + window.innerWidth - 440;
  popEl.style.left = left + 'px'; popEl.style.top = top + 'px';
}
function openDrawer(html, navy) { const d = document.getElementById('drawer'); d.className = 'drawer on' + (navy ? ' navy' : ''); d.innerHTML = html; document.getElementById('ov').classList.add('on'); }
function closeDrawer() { document.getElementById('drawer').className = 'drawer'; document.getElementById('ov').classList.remove('on'); }
function coach(key) {
  const c = D.coach[key], m = META[key];
  openDrawer(`<div class="dh"><div><h2>🎓 TOGAF Coach</h2><p>${m.title} ${m.phases.map((p) => `<span class="phase" style="background:rgba(255,255,255,.15);color:#fff">${p}</span>`).join('')}</p></div><button class="x" data-close>×</button></div>
   <div class="db"><div><div style="display:flex;justify-content:space-between"><b class="xs mut" style="text-transform:uppercase">What TOGAF says</b><span class="mchip mut">Offline · TOGAF excerpts</span></div>
   <ul style="padding-left:18px;margin:6px 0">${c.guidance.map((g) => `<li style="margin:5px 0">${esc(g.text)} ${(g.cites || []).map((n) => `<span class="tag">[${n}]</span>`).join(' ')}</li>`).join('')}</ul></div>
   <div><b class="xs mut" style="text-transform:uppercase">Next actions</b>${c.next_actions.map((a) => `<div style="background:var(--navy-soft);color:${C.navy};border-radius:8px;padding:8px 10px;margin-top:6px">→ ${esc(a)}</div>`).join('')}</div>
   <div><b class="xs mut" style="text-transform:uppercase">Sources</b>${c.citations.map((s) => `<div class="card" style="padding:6px 10px;margin-top:6px;display:flex;gap:8px;align-items:center"><span class="tag">${s.n}</span><span class="sm trunc">${esc(s.label)}</span></div>`).join('')}</div></div>
   <div class="df"><div class="fld" style="flex:1;margin-right:8px"><div class="in mut">Ask TOGAF about this screen…</div></div><button class="btn p" data-toast="Ask the coach">➤</button></div>`, true);
}

// ---------------------------------------------------------------- shell, routing, events
function sidebar() {
  document.getElementById('side').innerHTML = `<div class="brand"><div class="logo">EA</div><div><b>CIL EA Navigator</b><small>Coromandel · TOGAF 9.1</small></div></div><div class="grp">Assessment</div>
   ${ORDER.map((k) => `<button class="nav ${S.screen === k ? 'on' : ''}" data-go="${k}"><span>${META[k].nav}</span><span class="bd">${META[k].badge}</span></button>`).join('')}
   <div class="foot"><button class="nav" data-coach="${S.screen}">🎓 TOGAF Coach</button><button class="nav" data-toast="Settings">⚙ Settings</button><div style="padding:6px 4px"><span class="dot"></span>Offline mode · hybrid RAG</div>
   <div style="padding:6px 4px;opacity:.7">Static replica · demo data · read-only</div></div>`;
}
const SCREEN_FN = { overview, vision, business, applications, data_tech: dataTech, roadmap };
function render(scrollTo) {
  EX = []; FLOWS = []; closePop(); sidebar();
  const main = document.getElementById('main'); main.innerHTML = SCREEN_FN[S.screen]();
  drawFlows();
  if (scrollTo) { const el = document.getElementById(scrollTo); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } else window.scrollTo(0, 0);
}
function go(screen, view) {
  S.screen = screen;
  if (!view) return render();
  const map = { overview: () => { if (view !== 'adm') S.v.overview = view; return view === 'adm' ? 'sv-adm' : 'sv-states'; },
    vision: () => { S.v.vision = view; return view === 'ai' ? 'sv-ai' : 'sv-tabs'; },
    business: () => { if (['scatter', 'alignment', 'value_streams'].includes(view)) { S.v.business = 'heatmap'; S.v.bmode = view === 'value_streams' ? 'value_streams' : view; } else { S.v.business = view; if (view === 'heatmap') S.v.bmode = 'heat'; } return 'sv-steps'; },
    applications: () => { S.v.applications = view; if (['architecture', 'interaction', 'integration'].includes(view)) S.v.aview = view; return 'sv-tabs'; },
    data_tech: () => { S.v.data_tech = view; if (['platform', 'network', 'cloud', 'security', 'standards'].includes(view)) S.v.tview = view; return view === 'data_arch' ? 'sv-data_arch' : 'sv-tabs'; },
    roadmap: () => { S.v.roadmap = view; return view === 'governance' ? 'sv-governance' : `sv-${view}`; } };
  const target = map[screen]();
  render(target); history.replaceState(null, '', `#${screen}/${view}`);
}
function setV(key, val) {
  if (key === 'bmode') { S.v.bmode = val; S.v.business = val === 'heat' ? 'heatmap' : val; }
  else if (key === 'aview') { S.v.aview = val; S.v.applications = val; }
  else if (key === 'tview') { S.v.tview = val; S.v.data_tech = val; }
  else if (key === 'applications' && val === 'views') S.v.applications = S.v.aview;
  else if (key === 'data_tech' && val === 'tech') S.v.data_tech = S.v.tview;
  else S.v[key] = val;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-x],[data-go],[data-sv],[data-svgo],[data-v],[data-cap],[data-app],[data-ent],[data-pick],[data-coach],[data-find],[data-close],[data-toast]');
  if (!t) { if (!e.target.closest('.pop')) closePop(); return; }
  if (t.matches('a')) e.preventDefault();
  if (t.dataset.x !== undefined) { e.stopPropagation(); return openPop(t, EX[+t.dataset.x]); }
  closePop();
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.sv) { const [k, v] = t.dataset.sv.split(':'); return go(k, v); }
  if (t.dataset.svgo) { const [k, v] = t.dataset.svgo.split(':'); return go(k, v); }
  if (t.dataset.v) { const [k, v] = t.dataset.v.split(':'); return setV(k, v); }
  if (t.dataset.cap) return capSheet(t.dataset.cap);
  if (t.dataset.app) return appForm(t.dataset.app);
  if (t.dataset.ent) { S.v.ent = t.dataset.ent; const y = window.scrollY; render(); return window.scrollTo(0, y); }
  if (t.dataset.pick) { const p = t.dataset.pick; return p.startsWith('app:') ? appForm(p.slice(4)) : capSheet(p); }
  if (t.dataset.coach) return coach(t.dataset.coach);
  if (t.dataset.find) { document.getElementById('find-' + t.dataset.find).innerHTML = findingsBody(t.dataset.find); return; }
  if (t.dataset.close !== undefined) return closeDrawer();
  if (t.dataset.toast) return toast(`“${t.dataset.toast}” is live in the app; this replica is read-only.`);
});
document.addEventListener('change', (e) => { if (e.target.dataset.sel === 'ent') { S.v.ent = e.target.value; const y = window.scrollY; render(); window.scrollTo(0, y); } });
document.getElementById('ov').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closePop(); closeDrawer(); } });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawFlows, 150); });
(function init() { const [s, v] = location.hash.slice(1).split('/'); if (SCREEN_FN[s]) go(s, v); else render(); })();

</script>
</body>
</html>
