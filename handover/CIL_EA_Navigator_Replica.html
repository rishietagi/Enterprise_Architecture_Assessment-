<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIL EA Navigator Replica</title>
<style>
:root {
  --navy:#0B2A6F; --navy-soft:#E8EDF7; --bg:#F5F7FA; --card:#FFFFFF; --fg:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --soft:#F1F5F9; --strong:#0F9D8A; --dev:#D97706; --weak:#EA580C; --crit:#DC2626; --violet:#7C3AED; --side:#0A2461;
}
* { box-sizing:border-box; }
html, body { margin:0; }
body { background:var(--bg); color:var(--fg); font:13.5px/1.45 Inter, "Segoe UI", system-ui, Arial, sans-serif; }
button { font:inherit; cursor:pointer; }
.app { display:grid; grid-template-columns:240px minmax(0,1fr); min-height:100vh; }
/* sidebar */
.side { position:sticky; top:0; align-self:start; height:100vh; background:var(--side); color:#DCE3F2; display:flex; flex-direction:column; padding:14px 10px; }
.brand { display:flex; gap:10px; align-items:center; padding:4px 6px 16px; }
.logo { width:32px; height:32px; border-radius:8px; background:#fff; color:var(--navy); font-weight:800; display:grid; place-items:center; font-size:13px; }
.brand b { color:#fff; font-size:14px; display:block; } .brand small { font-size:11px; opacity:.75; }
.grp { font-size:11px; opacity:.6; padding:8px 8px 4px; }
.nav { display:flex; align-items:center; gap:8px; width:100%; border:0; background:none; color:#DCE3F2; padding:8px 10px; border-radius:8px; text-align:left; font-size:13.5px; }
.nav:hover { background:rgba(255,255,255,.08); } .nav.on { background:rgba(255,255,255,.12); color:#fff; font-weight:600; }
.nav .bd { margin-left:auto; font-size:9.5px; font-weight:700; background:rgba(255,255,255,.12); border-radius:4px; padding:1px 4px; }
.side .foot { margin-top:auto; font-size:11px; opacity:.75; padding:8px; }
.side .foot .nav { padding:6px 4px; }
.dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--strong); margin-right:6px; }
/* main */
main { padding:20px 24px 48px; max-width:1480px; width:100%; display:flex; flex-direction:column; gap:16px; }
.ph { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; }
.ph h1 { font-size:22px; margin:0; letter-spacing:-.01em; display:inline; }
.ph p { margin:2px 0 0; color:var(--muted); }
.phase { display:inline-block; margin-left:6px; background:var(--navy-soft); color:var(--navy); font-size:11px; font-weight:600; border-radius:6px; padding:1px 6px; vertical-align:4px; }
.ph-a { display:flex; gap:8px; flex-shrink:0; }
.btn { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:5px 11px; font-size:12.5px; font-weight:500; color:var(--fg); }
.btn:hover { background:var(--soft); } .btn.p { background:var(--navy); color:#fff; border-color:var(--navy); }
.btn.xs { padding:2px 7px; font-size:11px; border-radius:6px; }
.btn.ghost { border-color:transparent; background:none; }
/* summary */
.sum { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto; gap:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
.sum .lbl { font-size:10.5px; font-weight:600; letter-spacing:.05em; color:var(--muted); text-transform:uppercase; margin-bottom:6px; }
.sum .col + .col { border-left:1px solid var(--line); padding-left:20px; }
.chip-b { border:1px solid var(--line); background:var(--card); border-radius:6px; padding:2px 8px; font-size:11.5px; font-weight:500; margin:0 4px 4px 0; }
.chip-b:hover { border-color:var(--navy); color:var(--navy); } .chip-b.on { background:var(--navy); border-color:var(--navy); color:#fff; }
.status { font-size:11.5px; color:var(--muted); margin-top:4px; }
.outs li { list-style:none; font-size:12px; margin:1px 0; } .outs { margin:0; padding:0; }
.outs li::before { content:"✓"; color:var(--navy); font-weight:700; margin-right:6px; }
.rfp { display:grid; grid-template-columns:repeat(3,28px); gap:4px; }
.rfp span { width:28px; height:28px; border-radius:6px; background:var(--navy-soft); color:var(--navy); font-weight:700; font-size:12px; display:grid; place-items:center; }
/* kpis */
.kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; }
.kpi { position:relative; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 18px; }
.kpi .acc { position:absolute; left:0; top:14px; bottom:14px; width:4px; border-radius:0 4px 4px 0; }
.kl { font-size:12px; color:var(--muted); font-weight:500; display:flex; gap:5px; align-items:center; }
.kv { font-size:24px; font-weight:600; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
.kv small { font-size:14px; font-weight:400; color:var(--muted); }
.ks { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* card */
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; scroll-margin-top:12px; }
.ch { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:12px; }
.ch h3 { margin:0; font-size:15px; font-weight:600; display:flex; gap:6px; align-items:center; }
.ch p { margin:2px 0 0; color:var(--muted); font-size:12.5px; }
.ca { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.g12 { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:16px; }
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
/* tabs */
.tabs { display:inline-flex; background:var(--soft); border-radius:9px; padding:3px; gap:2px; }
.tabs button { border:0; background:none; padding:5px 12px; border-radius:7px; color:var(--muted); font-size:13px; }
.tabs button.on { background:var(--card); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.08); font-weight:500; }
.seg { display:inline-flex; gap:4px; flex-wrap:wrap; }
.seg button { border:1px solid var(--line); background:var(--card); border-radius:7px; padding:4px 10px; font-size:12.5px; }
.seg button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
/* table */
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:12px; font-weight:500; color:var(--muted); padding:7px 8px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:1; }
td { padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr.click { cursor:pointer; } tr.click:hover td { background:#FAFBFD; }
.r { text-align:right; } .c { text-align:center; } .num { font-variant-numeric:tabular-nums; }
.id { font-size:11.5px; font-weight:600; color:var(--muted); white-space:nowrap; }
.mut { color:var(--muted); } .sm { font-size:11.5px; } .xs { font-size:10.5px; }
.scroll { max-height:360px; overflow:auto; } .scroll.tall { max-height:560px; }
.trunc { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* badges */
.pb { display:inline-flex; align-items:center; height:18px; border:1px solid; border-radius:999px; padding:0 6px; font-size:10px; font-weight:500; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; }
.pb-deck { color:var(--navy); } .pb-public { color:var(--strong); } .pb-assumed { color:var(--dev); border-style:dashed; } .pb-client { color:var(--violet); } .pb-togaf { color:var(--muted); }
.pill { display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 6px; border-radius:6px; font-size:11px; font-weight:600; white-space:nowrap; }
.pill i { width:6px; height:6px; border-radius:50%; display:inline-block; }
.tag { display:inline-block; border-radius:5px; padding:0 6px; font-size:10.5px; font-weight:600; background:var(--navy-soft); color:var(--navy); white-space:nowrap; }
.mchip { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:5px; padding:0 5px; font-size:10.5px; margin:1px 2px 1px 0; white-space:nowrap; }
.mchip i { width:6px; height:6px; border-radius:50%; display:inline-block; }
/* explain */
.ib { width:15px; height:15px; border-radius:50%; border:1.3px solid #94A3B8; background:none; color:#94A3B8; font-size:9.5px; font-weight:700; font-style:italic; font-family:Georgia,serif; padding:0; line-height:12px; flex-shrink:0; }
.ib:hover { border-color:var(--navy); color:var(--navy); }
.pop { position:absolute; z-index:60; width:420px; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 32px rgba(15,23,42,.18); font-size:12px; }
.pop .h { display:flex; justify-content:space-between; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
.pop .h small { display:block; font-size:10px; font-weight:600; letter-spacing:.05em; color:var(--muted); text-transform:uppercase; }
.pop .h b { font-size:13px; } .pop table td { border:0; padding:3px 0; vertical-align:top; } .pop table td:first-child { width:42%; color:var(--muted); padding-right:10px; }
.pop .ln { max-height:240px; overflow:auto; padding:6px 14px; }
.pop .res { background:#E8EDF780; color:var(--navy); font-weight:600; padding:8px 14px; border-top:1px solid var(--line); }
.pop .rule { padding:8px 14px; border-top:1px solid var(--line); color:var(--muted); }
/* drawer / modal */
.ov { position:fixed; inset:0; background:rgba(15,23,42,.35); z-index:50; display:none; }
.ov.on { display:block; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:520px; max-width:100%; background:var(--card); z-index:55; display:none; flex-direction:column; box-shadow:-10px 0 30px rgba(0,0,0,.15); }
.drawer.on { display:flex; }
.drawer .dh { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; }
.drawer .dh h2 { margin:0; font-size:16px; } .drawer .dh p { margin:2px 0 0; color:var(--muted); font-size:12.5px; }
.drawer .db { flex:1; overflow:auto; padding:16px 20px; display:flex; flex-direction:column; gap:14px; }
.drawer .df { border-top:1px solid var(--line); padding:10px 20px; display:flex; justify-content:space-between; align-items:center; }
.drawer.navy .dh { background:var(--navy); color:#fff; } .drawer.navy .dh p { color:#C9D3EA; }
.x { border:0; background:none; font-size:18px; line-height:1; color:inherit; }
.fsec h4 { margin:0 0 6px; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--navy); }
.fgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.fld label { display:block; font-size:11.5px; color:var(--muted); font-weight:500; margin-bottom:3px; }
.fld .in { border:1px solid var(--line); border-radius:7px; padding:5px 9px; min-height:30px; font-size:13px; background:#fff; }
.score5 { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
.score5 span { border:1px solid var(--line); border-radius:6px; text-align:center; padding:4px 2px; font-size:11.5px; font-weight:600; }
.score5 span.on { background:var(--navy); border-color:var(--navy); color:#fff; }
.opt5 { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
.opt5 div { border:1px solid var(--line); border-radius:7px; padding:5px 4px; text-align:center; font-size:10.5px; line-height:1.2; }
.opt5 div b { display:block; font-size:13px; } .opt5 div.on { border-color:var(--navy); background:var(--navy-soft); }
.toast { position:fixed; bottom:18px; right:18px; background:var(--fg); color:#fff; padding:9px 14px; border-radius:8px; font-size:12.5px; z-index:70; opacity:0; transition:opacity .2s; pointer-events:none; }
.toast.on { opacity:1; }
/* misc */
.empty { border:1px dashed var(--line); border-radius:10px; padding:26px; text-align:center; color:var(--muted); }
.lgd { display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--muted); align-items:center; }
.lgd i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
.bar { height:8px; background:var(--soft); border-radius:999px; overflow:hidden; } .bar > i { display:block; height:100%; border-radius:999px; }
details.row { border:1px solid var(--line); border-radius:9px; background:var(--card); }
details.row > summary { list-style:none; display:flex; align-items:center; gap:10px; padding:8px 12px; cursor:pointer; }
details.row > summary::-webkit-details-marker { display:none; }
details.row[open] > summary { border-bottom:1px solid var(--line); }
details.row .body { padding:10px 14px; font-size:12.5px; }
.sw { width:30px; height:17px; border-radius:999px; background:#CBD5E1; position:relative; flex-shrink:0; }
.sw::after { content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition:left .15s; }
.sw.on { background:var(--navy); } .sw.on::after { left:15px; }
.flow { position:relative; width:100%; }
.flow svg { position:absolute; inset:0; pointer-events:none; }
.fnode { position:absolute; display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-left-width:3px; border-radius:6px; padding:0 8px; overflow:hidden; text-align:left; box-shadow:0 1px 2px rgba(0,0,0,.04); transition:opacity .15s; }
.fnode b { display:block; font-size:11.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fnode small { display:block; font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fnode.dim { opacity:.3; } .fcol { position:absolute; top:0; font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; }
.stepper { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:6px; }
.stepper button { display:flex; align-items:center; gap:9px; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:8px 12px; text-align:left; }
.stepper button b { display:block; font-size:12.5px; } .stepper button small { display:block; font-size:10.5px; color:var(--muted); }
.stepper .n { width:24px; height:24px; border-radius:50%; background:var(--navy-soft); color:var(--navy); font-weight:700; font-size:12px; display:grid; place-items:center; flex-shrink:0; }
.stepper button.on { background:var(--navy); border-color:var(--navy); color:#fff; } .stepper button.on small { color:#C9D3EA; } .stepper button.on .n { background:#fff; }
.tile { display:flex; flex-direction:column; justify-content:space-between; height:60px; border-radius:6px; border-left:3px solid; padding:5px 7px; text-align:left; border-top:0; border-right:0; border-bottom:0; }
.tile span.t { font-size:10.8px; line-height:12.5px; font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.chev { height:36px; display:grid; place-items:center; color:#fff; font-size:11.5px; font-weight:600; text-align:center; padding:0 14px; background:var(--navy); clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%,8% 50%); line-height:1.15; }
.chev.first { clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%); }
.zone { border:1px solid var(--line); border-radius:9px; }
.zone .zh { display:flex; justify-content:space-between; padding:7px 10px; border-bottom:1px solid var(--line); font-weight:600; font-size:12.5px; }
.notice { border:1px dashed var(--line); border-radius:9px; padding:7px 12px; font-size:12px; color:var(--muted); display:flex; gap:10px; align-items:center; }
.banner { background:var(--navy-soft); border-radius:9px; padding:8px 12px; font-size:12px; display:flex; justify-content:space-between; gap:10px; align-items:center; }
@media (max-width: 1100px) { .app { grid-template-columns:1fr; } .side { position:static; height:auto; } .kpis { grid-template-columns:1fr 1fr; } .sum { grid-template-columns:1fr; } .sum .col + .col { border-left:0; padding-left:0; } .stepper { grid-template-columns:repeat(3,1fr); } .g12 > * { grid-column:span 12 !important; } }
</style>
</head>

atus":"evidenced"},{"n":2,"name":"Business capability and business-IT alignment views","screen":"business","view":"heatmap","artifact":"Business Footprint Diagram; Application/Function matrix","togaf_ref":"35.6.3","records":45,"evidence":0,"status":"draft"},{"n":3,"name":"Application portfolio and application architecture","screen":"applications","view":"architecture","artifact":"Application Portfolio Catalog","togaf_ref":"35.6.5","records":26,"evidence":65,"status":"evidenced"},{"n":4,"name":"Application dependencies and interaction views","screen":"applications","view":"interaction","artifact":"Application Communication Diagram","togaf_ref":"35.6.5","records":32,"evidence":0,"status":"draft"},{"n":5,"name":"Integration, API and data-flow architecture","screen":"applications","view":"integration","artifact":"Interface Catalog; Application/Data matrix","togaf_ref":"35.6.5","records":32,"evidence":0,"status":"draft"},{"n":6,"name":"Data and analytics architecture","screen":"data_tech","view":"data_arch","artifact":"Data Dissemination Diagram","togaf_ref":"35.6.4","records":10,"evidence":60,"status":"evidenced"},{"n":7,"name":"Infrastructure and platform architecture","screen":"data_tech","view":"platform","artifact":"Platform Decomposition Diagram","togaf_ref":"35.6.6","records":8,"evidence":50,"status":"evidenced"},{"n":8,"name":"Network and connectivity architecture","screen":"data_tech","view":"network","artifact":"Network Computing / Hardware Diagram","togaf_ref":"35.6.6","records":8,"evidence":12,"status":"draft"},{"n":9,"name":"Cloud and hybrid architecture","screen":"data_tech","view":"cloud","artifact":"Environments and Locations Diagram","togaf_ref":"35.6.6","records":26,"evidence":65,"status":"evidenced"},{"n":10,"name":"Cybersecurity and resilience architecture","screen":"data_tech","view":"security","artifact":"Compliance checklists; security zones","togaf_ref":"48.5","records":10,"evidence":50,"status":"evidenced"},{"n":11,"name":"Technology standards and technology lifecycle views","screen":"data_tech","view":"standards","artifact":"Technology Standards Catalog","togaf_ref":"35.6.6","records":8,"evidence":50,"status":"evidenced"},{"n":12,"name":"Key architecture decisions, principles, standards and patterns","screen":"vision","view":"guardrails","artifact":"Principles Catalog; decision log","togaf_ref":"23.6","records":18,"evidence":0,"status":"draft"},{"n":13,"name":"Current-state, target-state and transition-state views","screen":"overview","view":"states","artifact":"Transition Architecture","togaf_ref":"36.2.14","records":71,"evidence":24,"status":"draft"},{"n":14,"name":"E2E views for critical business processes / services","screen":"business","view":"value_streams","artifact":"Value Chain / Process Flow Diagram","togaf_ref":"35.6.3","records":4,"evidence":0,"status":"draft"}],"counts":{"gaps":62,"initiatives":10,"apps":26,"capabilities":45}},"vision":{"engagement":{"client":"Coromandel International Ltd (CIL), Murugappa Group","request":"Establish a practical, industry-aligned (TOGAF) Enterprise Architecture baseline, define the future-state architecture and governance model, and provide a prioritized roadmap supporting growth through 2030.","horizon":"FY27-FY30 (2-5 year transition roadmap)","source":"deck"},"drivers":[{"id":"D1","driver":"Hybrid estate has grown through growth, cloud adoption and new digital investments - needs a common architecture baseline","source":"deck"},{"id":"D2","driver":"Architecture decisions and standards must be applied consistently across domains","source":"deck"},{"id":"D3","driver":"End-to-end visibility of dependencies across applications, data, infrastructure and security","source":"deck"},{"id":"D4","driver":"Scalable foundation for future applications, acquisitions (e.g. NACL Industries, 53% stake 2025) and AI adoption","source":"deck"},{"id":"D5","driver":"Shift from digital pilots to connected, intelligent, autonomous operations (AI-accelerated R&D, connected product+service, digital agronomy, drones)","source":"deck"},{"id":"D6","driver":"Retail network scale-up (1,075 Gromor stores Nov-2025; plan to roughly double) and 1M+ farmer app users","source":"public"}],"focus_areas":[{"id":"F1","name":"AI-accelerated R&D","detail":"Formulation, trials, crop response and knowledge reuse","source":"deck"},{"id":"F2","name":"Connected product + service","detail":"Diagnostics, recommendations and precision application","source":"deck"},{"id":"F3","name":"Digital agronomy platform","detail":"Advisory, satellite insights, orders and service journeys","source":"deck"},{"id":"F4","name":"Drone & robotics ecosystem","detail":"Hardware, prescription maps, telemetry and operations","source":"deck"},{"id":"F5","name":"Data, AI & EA foundation","detail":"Data domains, APIs, cloud, security, MLOps and governance","source":"deck"}],"scope":{"in_scope":["Business, Application, Data, Technology architecture (TOGAF B-D)","Cross-cutting: Security, Integration, AI, Governance, Transition","50-60 external applications (COTS & custom) + core apps","EA operating model, governance & repository","2-5 year transition roadmap"],"out_of_scope":["SAP RISE (ERP) detailed assessment - dependencies captured only","OT systems detailed assessment - dependencies captured only"],"constraints":["Microsoft-centric stack (Azure, SQL Server, Entra ID SSO, M365/Copilot)","DC Hyderabad + DR Chennai + Azure hybrid","Mostly two/three-tier apps; limited microservices/containers"],"source":"deck"},"stakeholders":[{"viewpoint":"Business & Functional Leaders","concerns":"Value, capability and process","screens":["business","roadmap"],"source":"deck"},{"viewpoint":"CIO & Enterprise Architecture","concerns":"Standards, target state and roadmap","screens":["vision","roadmap"],"source":"deck"},{"viewpoint":"Application & Data Owners","concerns":"Lifecycle, interfaces and ownership","screens":["applications","data_tech"],"source":"deck"},{"viewpoint":"Infrastructure & Security","concerns":"Resilience, controls and platforms","screens":["data_tech"],"source":"deck"},{"viewpoint":"Delivery & Governance Forums","concerns":"Decisions, compliance and change","screens":["roadmap"],"source":"deck"}],"principles":{"togaf":[{"id":"TOGAF-01","number":1,"name":"Primacy of Principles","category":"Business","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.1 Principle 1: Primary of Principles · p.277.","citation":{"id":"course:23.6.1:0","label":"TOGAF 9.1 §23.6.1 Principle 1: Primary of Principles · p.277","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.1 Business Principles > Principle 1: Primary of Principles","section_no":"23.6.1","page":277,"content_type":"principle","source":"course","score":0.0,"text":"Principle 1: Primary of Principles\n\nStatement:\nThese principles of information management apply to all organizations within the enterprise.\n\nRationale:\nThe only way we can provide a consistent and measurable level of quality information to decision-makers is if all organizations abide by the principles.\n\nImplications:\n• Without this principle, exclusions, favor itism, and inconsistency would rapidly undermine the management of information.\n• Information management initiatives will not begin until they are examined for compliance with the principles.\n• A conflict with a principle will be resolved by changing the framework of the initiative."},"source":"togaf","adopted":true},{"id":"TOGAF-02","number":2,"name":"Maximize Benefit to the Enterprise","category":"Business","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.1 Principle 2: Maximize Benefit to the Enterprise · p.277.","citation":{"id":"course:23.6.1:1","label":"TOGAF 9.1 §23.6.1 Principle 2: Maximize Benefit to the Enterprise · p.277","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.1 Business Principles > Principle 2: Maximize Benefit to the Enterprise","section_no":"23.6.1","page":277,"content_type":"principle","source":"course","score":0.0,"text":"Principle 2: Maximize Benefit to the Enterprise\n\nStatement:\nInformation management decisions are made to provide maximum benefit to the enterprise as a whole.\n\nRationale:\nThis principle embodies \"service above self \". Decisions made from an enterprise-wide perspective have greater long-term value than decisions made from any particular organizational perspective. Maximum return on investment requires information management decisions to adhere to enterprise-wide drivers and priorities. No minor ity group will detract from the benefit of the whole. How ever, this principle will not preclude any minor ity group from getting its job done.\n\nImplications:\n• Achieving maximum enterprise-wide benefit will require changes in the way we plan and manage information. Technology alone will not bring about this change.\n• Some organizations may have to concede their own preferences for the greater benefit of the entire enterprise.\n\n• Application development priorities must be established by the entire enterprise for the entire enterprise.\n• Applications components should be shared across organizational boundaries.\n• Information management initiatives should be conducted in accordance with the enterprise plan. Individual organizations should pursue information management initiatives which conform to the bluepr ints and priorities established by the enterprise. We will change the plan as we …"},"source":"togaf","adopted":true},{"id":"TOGAF-03","number":3,"name":"Information Management is Everybody's Business","category":"Business","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.1 Principle 3: Information Management is Everybody’s Busin · p.277.","citation":{"id":"course:23.6.1:2","label":"TOGAF 9.1 §23.6.1 Principle 3: Information Management is Everybody’s Busin · p.277","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.1 Business Principles > Principle 3: Information Management is Everybody’s Business","section_no":"23.6.1","page":277,"content_type":"principle","source":"course","score":0.0,"text":"Principle 3: Information Management is Everybody’s Business\n\nStatement:\nAll organizations in the enterprise participate in information management decisions needed to accomplish business objectives.\n\nRationale:\nInformation users are the key stakeholders, or customers, in the application of technology to address a business need. In order to ensure information management is aligned with the business, all organizations in the enterprise must be involved in all aspects of the information environment. The business experts from across the enterprise and the technical staff responsible for developing and sustaining the information environment need to come together as a team to jointly define the goals and objectives of IT.\n\nImplications:\n• To operate as a team, every stakeholder, or customer, will need to accept responsibility for developing the information environment.\n• Commitment of resources will be required to implement this principle."},"source":"togaf","adopted":false},{"id":"TOGAF-04","number":4,"name":"Business Continuity","category":"Business","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.1 Principle 4: Business Continuity · p.277.","citation":{"id":"course:23.6.1:3","label":"TOGAF 9.1 §23.6.1 Principle 4: Business Continuity · p.277","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.1 Business Principles > Principle 4: Business Continuity","section_no":"23.6.1","page":277,"content_type":"principle","source":"course","score":0.0,"text":"Principle 4: Business Continuity\n\nStatement:\nEnterprise operations are maintained in spite of system interruptions.\n\nRationale:\nAs system operations become more pervasive, we become more dependent on them; therefore, we must consider the reliability of such systems throughout their design and use. Business premises throughout the enterprise must be provided with the capability to continue their business functions regardless of external ev ents. Hardware failure, natural disasters, and data corr uption should not be allowed to disr upt or stop enterprise activities. The enterprise business functions must be capable of operating on alternative information delivery mechanisms.\n\nImplications:\n• Dependency on shared system applications mandates that the risks of business interruption must be established in advance and managed.\nManagement includes but is not limited to periodic reviews, testing for vulnerability and exposure, or designing mission-critical services to ensure business function continuity through redundant or alternative capabilities.\n• Recoverability, redundancy, and maintainability should be addressed at the time of design.\n• Applications must be assessed for criticality and impact on the enterprise mission, in order to determine what level of continuity is required and what corresponding recovery plan is necessary."},"source":"togaf","adopted":false},{"id":"TOGAF-05","number":5,"name":"Common Use Applications","category":"Business","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.1 Principle 5: Common Use Applications · p.277.","citation":{"id":"course:23.6.1:4","label":"TOGAF 9.1 §23.6.1 Principle 5: Common Use Applications · p.277","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.1 Business Principles > Principle 5: Common Use Applications","section_no":"23.6.1","page":277,"content_type":"principle","source":"course","score":0.0,"text":"Principle 5: Common Use Applications\n\nStatement:\nDevelopment of applications used across the enterprise is preferred over the development of similar or duplicative applications which are only provided to a particular organization.\n\nRationale:\nDuplicative capability is expensive and proliferates conflicting data.\n\nImplications:\n• Organizations which depend on a capability which does not serve the entire enterprise must change over to the replacement enterprise-wide capability. This will require establishment of and adherence to a policy requiring this.\n• Organizations will not be allowed to dev elop capabilities for their own use which are similar/duplicative of enterprise-wide capabilities. In this way, expenditures of scarce resources to develop essentially the same capability in marginally different ways will be reduced.\n• Data and information used to support enterprise decision-making will be standardized to a much greater extent than previously. This is because the smaller, organizational capabilities which produced different data (which was not shared among other organizations) will be replaced by enterprise-wide capabilities. The impetus for adding to the set of enterprise-wide capabilities may well come from an organization making a convincing case for the value of the data/information previously produced by its organizational capability, but the resulting capability …"},"source":"togaf","adopted":false},{"id":"TOGAF-06","number":6,"name":"Service Orientation","category":"Business","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.1 Principle 6: Service Orientation · p.277.","citation":{"id":"course:23.6.1:5","label":"TOGAF 9.1 §23.6.1 Principle 6: Service Orientation · p.277","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.1 Business Principles > Principle 6: Service Orientation","section_no":"23.6.1","page":277,"content_type":"principle","source":"course","score":0.0,"text":"Principle 6: Service Orientation\n\nStatement:\nThe architecture is based on a design of services which mirror real-world business activities comprising the enterprise (or inter-enterprise) business processes.\n\nRationale:\nService orientation delivers enterprise agility and Boundaryless Information\nFlow.\n\nImplications:\n• Service representation utilizes business descriptions to provide context (i.e., business process, goal, rule, policy, service interface, and service component) and implements services using service orchestration.\n• Service orientation places unique requirements on the infrastructure, and implementations should use open standards to realize interoperability and location transparency.\n• Implementations are environment-specific; they are constrained or enabled by context and must be described within that context.\n• Strong governance of service representation and implementation is required.\n• A \"Litmus Test\", which determines a \"good service\", is required."},"source":"togaf","adopted":false},{"id":"TOGAF-07","number":7,"name":"Compliance with Law","category":"Business","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.1 Principle 7: Compliance with Law · p.277.","citation":{"id":"course:23.6.1:6","label":"TOGAF 9.1 §23.6.1 Principle 7: Compliance with Law · p.277","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.1 Business Principles > Principle 7: Compliance with Law","section_no":"23.6.1","page":277,"content_type":"principle","source":"course","score":0.0,"text":"Principle 7: Compliance with Law\n\nStatement:\nEnterprise information management processes comply with all relevant laws, policies, and regulations.\n\nRationale:\nEnterprise policy is to abide by laws, policies, and regulations. This will not preclude business process improvements that lead to changes in policies and regulations.\n\nImplications:\n• The enterprise must be mindful to comply with laws, regulations, and external policies regarding the collection, retention, and management of data.\n• Education and access to the rules. Efficiency, need, and common sense are not the only drivers. Changes in the law and changes in regulations may drive changes in our processes or applications."},"source":"togaf","adopted":false},{"id":"TOGAF-08","number":8,"name":"IT Responsibility","category":"Business","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.1 Principle 8: IT Responsibility · p.277.","citation":{"id":"course:23.6.1:7","label":"TOGAF 9.1 §23.6.1 Principle 8: IT Responsibility · p.277","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.1 Business Principles > Principle 8: IT Responsibility","section_no":"23.6.1","page":277,"content_type":"principle","source":"course","score":0.0,"text":"Principle 8: IT Responsibility\n\nStatement:\nThe IT organization is responsible for owning and implementing IT processes and infrastructure that enable solutions to meet user-defined requirements for functionality, service levels, cost, and delivery timing.\n\nRationale:\nEffectively align expectations with capabilities and costs so that all projects are cost-effective. Efficient and effective solutions have reasonable costs and clear benefits.\n\nImplications:\n• A process must be created to prioritize projects.\n• The IT function must define processes to manage business unit expectations.\n• Data, application, and technology models must be created to enable integrated quality solutions and to maximize results."},"source":"togaf","adopted":false},{"id":"TOGAF-09","number":9,"name":"Protection of Intellectual Property","category":"Business","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.1 Principle 9: Protection of Intellectual Property · p.277.","citation":{"id":"course:23.6.1:8","label":"TOGAF 9.1 §23.6.1 Principle 9: Protection of Intellectual Property · p.277","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.1 Business Principles > Principle 9: Protection of Intellectual Property","section_no":"23.6.1","page":277,"content_type":"principle","source":"course","score":0.0,"text":"Principle 9: Protection of Intellectual Property\n\nStatement:\nThe enterprise’s Intellectual Property (IP) must be protected. This protection must be reflected in the IT architecture, implementation, and governance processes.\n\nRationale:\nA major part of an enterprise’s IP is hosted in the IT domain.\n\nImplications:\n• While protection of IP assets is everybody’s business, much of the actual protection is implemented in the IT domain. Even trust in non-IT processes can be managed by IT processes (email, mandatory notes, etc.).\n• A security policy, governing human and IT actors, will be required that can substantially improve protection of IP. This must be capable of both avoiding compromises and reducing liabilities.\n• Resources on such policies can be found at the SANS Institute (refer to\n\nwww.sans.org/newlook/home.php)."},"source":"togaf","adopted":false},{"id":"TOGAF-10","number":10,"name":"Data is an Asset","category":"Data","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.2 Principle 10: Data is an Asset · p.281.","citation":{"id":"course:23.6.2:0","label":"TOGAF 9.1 §23.6.2 Principle 10: Data is an Asset · p.281","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.2 Data Principles > Principle 10: Data is an Asset","section_no":"23.6.2","page":281,"content_type":"principle","source":"course","score":0.0,"text":"Principle 10: Data is an Asset\n\nStatement:\nData is an asset that has value to the enterprise and is managed accordingly.\n\nRationale:\nData is a valuable corporate resource; it has real, measurable value. In simple terms, the purpose of data is to aid decision-making. Accurate, timely data is critical to accurate, timely decisions. Most corporate assets are carefully managed, and data is no exception. Data is the foundation of our decision- making, so we must also carefully manage data to ensure that we know where it is, can rely upon its accuracy, and can obtain it when and where we need it.\n\nImplications:\n• This is one of three closely-related principles regarding data: data is an asset; data is shared; and data is easily accessible. The implication is that there is an education task to ensure that all organizations within the enterprise understand the relationship between value of data, sharing of data, and accessibility to data.\n• Stewards must have the authority and means to manage the data for which they are accountable.\n• We must make the cultural transition from \"data ownership\" thinking to\n\"data stewardship\" thinking.\n• The role of data steward is critical because obsolete, incorrect, or inconsistent data could be passed to enterprise personnel and adversely affect decisions across the enterprise.\n• Part of the role of data steward, who manages the data, is to ensure …"},"source":"togaf","adopted":true},{"id":"TOGAF-11","number":11,"name":"Data is Shared","category":"Data","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.2 Principle 11: Data is Shared · p.281.","citation":{"id":"course:23.6.2:1","label":"TOGAF 9.1 §23.6.2 Principle 11: Data is Shared · p.281","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.2 Data Principles > Principle 11: Data is Shared","section_no":"23.6.2","page":281,"content_type":"principle","source":"course","score":0.0,"text":"Principle 11: Data is Shared\n\nStatement:\nUsers have access to the data necessary to perform their duties; therefore, data is shared across enterprise functions and organizations.\n\nRationale:\nTimely access to accurate data is essential to improving the quality and efficiency of enterprise decision-making. It is less costly to maintain timely, accurate data in a single application, and then share it, than it is to maintain duplicative data in multiple applications. The enterprise holds a wealth of data, but it is stored in hundreds of incompatible stovepipe databases. The speed of data collection, creation, transfer, and assimilation is driven by the ability of the organization to efficiently share these islands of data across the organization.\n\nShared data will result in improved decisions since we will rely on few er (ultimately one virtual) sources of more accurate and timely managed data for\n\nall of our decision-making. Electronically shared data will result in increased efficiency when existing data entities can be used, without re-keying, to create new entities.\n\nImplications:\n• This is one of three closely-related principles regarding data: data is an asset; data is shared; and data is easily accessible. The implication is that there is an education task to ensure that all organizations within the enterprise understand the relationship between value of data, sharing of …"},"source":"togaf","adopted":false},{"id":"TOGAF-12","number":12,"name":"Data is Accessible","category":"Data","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.2 Principle 12: Data is Accessible · p.281.","citation":{"id":"course:23.6.2:2","label":"TOGAF 9.1 §23.6.2 Principle 12: Data is Accessible · p.281","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.2 Data Principles > Principle 12: Data is Accessible","section_no":"23.6.2","page":281,"content_type":"principle","source":"course","score":0.0,"text":"Principle 12: Data is Accessible\n\nStatement:\nData is accessible for users to perform their functions.\n\nRationale:\nWide access to data leads to efficiency and effectiveness in decision-making, and affords timely response to information requests and service delivery.\nUsing information must be considered from an enterprise perspective to allow access by a wide variety of users. Staff time is saved and consistency of data is improved.\n\nImplications:\n• This is one of three closely-related principles regarding data: data is an asset; data is shared; and data is easily accessible. The implication is that there is an education task to ensure that all organizations within the enterprise understand the relationship between value of data, sharing of data, and accessibility to data.\n\n• Accessibility involves the ease with which users obtain information.\n• The way information is accessed and displayed must be sufficiently adaptable to meet a wide range of enterprise users and their corresponding methods of access.\n• Access to data does not constitute understanding of the data. Personnel should take caution not to misinterpret information.\n• Access to data does not necessarily grant the user access rights to modify or disclose the data. This will require an education process and a change in the organizational culture, which currently supports a belief in\n\"ownership\" of data by functional …"},"source":"togaf","adopted":false},{"id":"TOGAF-13","number":13,"name":"Data Trustee","category":"Data","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.2 Principle 13: Data Trustee · p.281.","citation":{"id":"course:23.6.2:3","label":"TOGAF 9.1 §23.6.2 Principle 13: Data Trustee · p.281","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.2 Data Principles > Principle 13: Data Trustee","section_no":"23.6.2","page":281,"content_type":"principle","source":"course","score":0.0,"text":"Principle 13: Data Trustee\n\nStatement:\nEach data element has a trustee accountable for data quality.\n\nRationale:\nOne of the benefits of an architected environment is the ability to share data (e.g., text, video, sound, etc.) across the enterprise. As the degree of data sharing grows and business units rely upon common information, it becomes essential that only the data trustee makes decisions about the content of data.\nSince data can lose its integrity when it is entered multiple times, the data trustee will have sole responsibility for data entry which eliminates redundant human effort and data storage resources.\n\nNote:\nA trustee is different than a steward — a trustee is responsible for accuracy and currency of the data, while responsibilities of a steward may be broader and include data standardization and definition tasks.\n\nImplications:\n• Real trusteeship dissolves the data \"ownership\" issues and allows the data to be available to meet all users’ needs. This implies that a cultural change from data \"ownership\" to data \"trusteeship\" may be required.\n• The data trustee will be responsible for meeting quality requirements levied upon the data for which the trustee is accountable.\n• It is essential that the trustee has the ability to provide user confidence in the data based upon attributes such as \"data source\".\n• It is essential to identify the true source of the data in …"},"source":"togaf","adopted":false},{"id":"TOGAF-14","number":14,"name":"Common Vocabulary and Data Definitions","category":"Data","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.2 Principle 14: Common Vocabulary and Data Definitions · p.281.","citation":{"id":"course:23.6.2:4","label":"TOGAF 9.1 §23.6.2 Principle 14: Common Vocabulary and Data Definitions · p.281","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.2 Data Principles > Principle 14: Common Vocabulary and Data Definitions","section_no":"23.6.2","page":281,"content_type":"principle","source":"course","score":0.0,"text":"Principle 14: Common Vocabulary and Data Definitions\n\nStatement:\nData is defined consistently throughout the enterprise, and the definitions are understandable and available to all users.\n\nRationale:\nThe data that will be used in the development of applications must have a common definition throughout the Headquarters to enable sharing of data. A common vocabulary will facilitate communications and enable dialog to be effective. In addition, it is required to interface systems and exchange data.\n\nImplications:\n• We are lulled into thinking that this issue is adequately addressed because there are people with \"data administration\" job titles and for ums with charters implying responsibility. Significant additional energy and resources must be committed to this task. It is key to the success of efforts to improve the information environment. This is separate from but related to the issue of data element definition, which is addressed by a broad community — this is more like a common vocabulary and definition.\n• The enterprise must establish the initial common vocabulary for the business.\nThe definitions will be used unifor mly throughout the enterprise.\n• Whenever a new data definition is required, the definition effort will be co-ordinated and reconciled with the corporate \"glossary\" of data descriptions. The enterprise data administrator will provide this co- ordination.\n• …"},"source":"togaf","adopted":false},{"id":"TOGAF-15","number":15,"name":"Data Security","category":"Data","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.2 Principle 15: Data Security · p.281.","citation":{"id":"course:23.6.2:5","label":"TOGAF 9.1 §23.6.2 Principle 15: Data Security · p.281","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.2 Data Principles > Principle 15: Data Security","section_no":"23.6.2","page":281,"content_type":"principle","source":"course","score":0.0,"text":"Principle 15: Data Security\n\nStatement:\nData is protected from unauthorized use and disclosure. In addition to the traditional aspects of national security classification, this includes, but is not limited to, protection of pre-decisional, sensitive, source selection-sensitive, and proprietar y information.\n\nRationale:\nOpen sharing of information and the release of information via relevant legislation must be balanced against the need to restrict the availability of classified, proprietar y, and sensitive information.\n\nExisting laws and regulations require the safeguarding of national security and the privacy of data, while permitting free and open access. Pre-decisional (work-in-progress, not yet authorized for release) information must be protected to avoid unwarranted speculation, misinterpretation, and inappropr iate use.\n\nImplications:\n• Aggregation of data, both classified and not, will create a large target requiring review and de-classification procedures to maintain appropriate control. Data owners and/or functional users must determine whether the aggregation results in an increased classification level. We will need appropriate policy and procedures to handle this review and de- classification. Access to information based on a need-to-know policy will force regular reviews of the body of information.\n\n• The current practice of having separate systems to contain …"},"source":"togaf","adopted":true},{"id":"TOGAF-16","number":16,"name":"Technology Independence","category":"Application","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.3 Principle 16: Technology Independence · p.285.","citation":{"id":"course:23.6.3:0","label":"TOGAF 9.1 §23.6.3 Principle 16: Technology Independence · p.285","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.3 Application Principles > Principle 16: Technology Independence","section_no":"23.6.3","page":285,"content_type":"principle","source":"course","score":0.0,"text":"Principle 16: Technology Independence\n\nStatement:\nApplications are independent of specific technology choices and therefore can operate on a variety of technology platforms.\n\nRationale:\nIndependence of applications from the underlying technology allows applications to be developed, upgraded, and operated in the most cost- effective and timely way. Otherwise technology, which is subject to continual obsolescence and vendor dependence, becomes the driver rather than the user requirements themselves.\n\nRealizing that every decision made with respect to IT makes us dependent on that technology, the intent of this principle is to ensure that Application\nSoftware is not dependent on specific hardware and operating systems software.\n\nImplications:\n• This principle will require standards which support portability.\n• For Commercial Off-The-Shelf (COTS) and Government Off-The-Shelf (GOTS) applications, there may be limited current choices, as many of these applications are technology and platform-dependent.\n• Subsystem interfaces will need to be developed to enable legacy applications to interoperate with applications and operating environments developed under the enterprise architecture.\n• Middleware should be used to decouple applications from specific software solutions.\n\n• As an example, this principle could lead to use of Java, and future Java- like protocols, which give a high …"},"source":"togaf","adopted":false},{"id":"TOGAF-17","number":17,"name":"Ease-of-Use","category":"Application","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.3 Principle 17: Ease-of-Use · p.285.","citation":{"id":"course:23.6.3:1","label":"TOGAF 9.1 §23.6.3 Principle 17: Ease-of-Use · p.285","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.3 Application Principles > Principle 17: Ease-of-Use","section_no":"23.6.3","page":285,"content_type":"principle","source":"course","score":0.0,"text":"Principle 17: Ease-of-Use\n\nStatement:\nApplications are easy to use. The underlying technology is transparent to users, so they can concentrate on tasks at hand.\n\nRationale:\nThe more a user has to understand the underlying technology, the less productive that user is. Ease-of-use is a positive incentive for use of applications. It encourages users to work within the integrated information environment instead of developing isolated systems to accomplish the task outside of the enterprise’s integrated information environment. Most of the knowledge required to operate one system will be similar to others. Training is kept to a minimum, and the risk of using a system improperly is low.\n\nUsing an application should be as intuitive as driving a different car.\n\nImplications:\n• Applications will be required to have a common \"look-and-feel\" and support ergonomic requirements. Hence, the common look-and-feel standard must be designed and usability test criteria must be developed.\n• Guidelines for user interfaces should not be constrained by narrow assumptions about user location, language, systems training, or physical capability. Factors such as linguistics, customer physical infirmities (visual acuity, ability to use keyboard/mouse), and proficiency in the use of technology have broad ramifications in determining the ease-of-use of an application."},"source":"togaf","adopted":false},{"id":"TOGAF-18","number":18,"name":"Requirements-Based Change","category":"Technology","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.4 Principle 18: Requirements-Based Change · p.286.","citation":{"id":"course:23.6.4:0","label":"TOGAF 9.1 §23.6.4 Principle 18: Requirements-Based Change · p.286","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.4 Technology Principles > Principle 18: Requirements-Based Change","section_no":"23.6.4","page":286,"content_type":"principle","source":"course","score":0.0,"text":"Principle 18: Requirements-Based Change\n\nStatement:\nOnly in response to business needs are changes to applications and technology made.\n\nRationale:\nThis principle will foster an atmosphere where the information environment changes in response to the needs of the business, rather than having the business change in response to IT changes. This is to ensure that the purpose of the information support — the transaction of business — is the basis for any proposed change. Unintended effects on business due to IT changes will be minimized. A change in technology may provide an opportunity to improve the business process and, hence, change business needs.\n\nImplications:\n• Changes in implementation will follow full examination of the proposed changes using the enterprise architecture.\n• We don’t fund a technical improvement or system development unless a documented business need exists.\n• Change management processes confor ming to this principle will be developed and implemented.\n• This principle may bump up against the responsive change principle. We must ensure the requirements documentation process does not hinder responsive change to meet legitimate business needs. The purpose of this principle is to keep us focused on business, not technology needs —\n\nresponsive change is also a business need."},"source":"togaf","adopted":false},{"id":"TOGAF-19","number":19,"name":"Responsive Change Management","category":"Technology","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.4 Principle 19: Responsive Change Management · p.286.","citation":{"id":"course:23.6.4:1","label":"TOGAF 9.1 §23.6.4 Principle 19: Responsive Change Management · p.286","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.4 Technology Principles > Principle 19: Responsive Change Management","section_no":"23.6.4","page":286,"content_type":"principle","source":"course","score":0.0,"text":"Principle 19: Responsive Change Management\n\nStatement:\nChanges to the enterprise information environment are implemented in a timely manner.\n\nRationale:\nIf people are to be expected to work within the enterprise information environment, that information environment must be responsive to their needs.\n\nImplications:\n• We have to dev elop processes for managing and implementing change that do not create delays.\n• A user who feels a need for change will need to connect with a \"business expert\" to facilitate explanation and implementation of that need.\n• If we are going to make changes, we must keep the architectures updated.\n• Adopting this principle might require additional resources.\n• This will conflict with other principles (e.g., maximum enterprise-wide benefit, enterprise-wide applications, etc.)."},"source":"togaf","adopted":false},{"id":"TOGAF-20","number":20,"name":"Control Technical Diversity","category":"Technology","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.4 Principle 20: Control Technical Diversity · p.286.","citation":{"id":"course:23.6.4:2","label":"TOGAF 9.1 §23.6.4 Principle 20: Control Technical Diversity · p.286","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.4 Technology Principles > Principle 20: Control Technical Diversity","section_no":"23.6.4","page":286,"content_type":"principle","source":"course","score":0.0,"text":"Principle 20: Control Technical Diversity\n\nStatement:\nTechnological diversity is controlled to minimize the non-trivial cost of maintaining exper tise in and connectivity between multiple processing environments.\n\nRationale:\nThere is a real, non-trivial cost of infrastructure required to support alternative technologies for processing environments. There are further infrastructure costs incurred to keep multiple processor constructs interconnected and maintained.\n\nLimiting the number of supported components will simplify maintainability and reduce costs.\n\nThe business advantages of minimum technical diversity include: standard packaging of components; predictable implementation impact; predictable valuations and returns; redefined testing; utility status; and increased flexibility to accommodate technological advancements. Common technology across the enterprise brings the benefits of economies of scale to the enterprise.\nTechnical administration and support costs are better controlled when limited resources can focus on this shared set of technology.\n\nImplications:\n• Policies, standards, and procedures that govern acquisition of technology must be tied directly to this principle.\n• Technology choices will be constrained by the choices available within the technology blueprint. Procedures for augmenting the acceptable technology set to meet evolving requirements will have to …"},"source":"togaf","adopted":false},{"id":"TOGAF-21","number":21,"name":"Interoperability","category":"Technology","statement":"Statement, rationale and implications: see TOGAF 9.1 §23.6.4 Principle 21: Interoperability · p.286.","citation":{"id":"course:23.6.4:3","label":"TOGAF 9.1 §23.6.4 Principle 21: Interoperability · p.286","breadcrumb":"TOGAF 9.1 > ADM_Guidelines_&_Techniques > 23 Architecture Principles > 23.6 Example Set of Architecture Principles > 23.6.4 Technology Principles > Principle 21: Interoperability","section_no":"23.6.4","page":286,"content_type":"principle","source":"course","score":0.0,"text":"Principle 21: Interoperability\n\nStatement:\nSoftware and hardware should conform to defined standards that promote interoperability for data, applications, and technology.\n\nRationale:\nStandards help ensure consistency, thus improving the ability to manage systems and improve user satisfaction, and protect existing IT investments, thus maximizing return on investment and reducing costs.\nStandards for interoperability additionally help ensure support from multiple vendors for their products, and facilitate supply chain integration.\n\nImplications:\n• Interoperability standards and industry standards will be followed unless there is a compelling business reason to implement a non-standard solution.\n• A process for setting standards, reviewing and revising them periodically, and granting exceptions must be established.\n• The existing IT platforms must be identified and documented."},"source":"togaf","adopted":true}],"cil":[{"id":"P-AI-01","name":"Human-in-the-loop for agronomy","statement":"AI recommendations that affect farmer inputs or spend are reviewed or confirmable by an agronomist or the farmer.","category":"AI","togaf_basis":"Principle 7 Compliance with Law","source":"assumed","active":true,"adopted":true,"citation":null},{"id":"P-AI-02","name":"Grounded and explainable AI","statement":"Generative AI answers cite their source data/documents; no ungrounded advice in farmer channels.","category":"AI","togaf_basis":"Principle 12 Data is Accessible","source":"assumed","active":true,"adopted":true,"citation":null},{"id":"P-AI-03","name":"Privacy by design (DPDP Act 2023)","statement":"Farmer and employee personal data is classified, consented and minimised before any AI use.","category":"AI","togaf_basis":"Principle 15 Data Security","source":"assumed","active":true,"adopted":true,"citation":null},{"id":"P-AI-04","name":"Shared AI platform, no shadow AI","statement":"AI use cases run on the common Azure AI/ML platform with MLOps, not isolated vendor tools.","category":"AI","togaf_basis":"Principle 20 Control Technical Diversity","source":"assumed","active":true,"adopted":true,"citation":null},{"id":"P-AI-05","name":"AI value tracked","statement":"Every AI initiative has a measurable business KPI and an owner, reviewed by the ARB.","category":"AI","togaf_basis":"Principle 18 Requirements-Based Change","source":"assumed","active":true,"adopted":true,"citation":null},{"id":"P-CIL-01","name":"Cloud-smart on Azure","statement":"New workloads default to Azure PaaS/containers; DC Hyderabad hosts only what must stay on-prem.","category":"Technology","togaf_basis":"Principle 20 Control Technical Diversity","source":"assumed","active":true,"adopted":true,"citation":null},{"id":"P-CIL-02","name":"Clean-core ERP","statement":"Keep SAP S/4HANA (RISE) standard; extend side-by-side via APIs, not core modifications.","category":"Application","togaf_basis":"Principle 5 Common Use Applications","source":"assumed","active":true,"adopted":true,"citation":null},{"id":"P-CIL-03","name":"API-first integration","statement":"Systems integrate through governed APIs/events, not point-to-point file drops or DB links.","category":"Application","togaf_basis":"Principle 21 Interoperability","source":"assumed","active":true,"adopted":true,"citation":null},{"id":"P-CIL-04","name":"One farmer, one record","statement":"Farmer, dealer and product data have a single owner and system of record shared across retail, app and agronomy.","category":"Data","togaf_basis":"Principles 10-14 (Data is an Asset / Shared / Trustee / Common Vocabulary)","source":"assumed","active":true,"adopted":true,"citation":null},{"id":"P-CIL-05","name":"Acquisition-ready architecture","statement":"A standard integration playbook (identity, finance, master data) onboards acquired entities like NACL within 2 quarters.","category":"Business","togaf_basis":"Principle 2 Maximize Benefit to the Enterprise","source":"assumed","active":true,"adopted":true,"citation":null}],"adopted":15,"limit":{"min":10,"max":20,"ref":"23.6"},"warning":null},"ai_initiatives":[{"id":"AI-01","name":"Microsoft 365 Copilot rollout","type":"Productivity","status":"In use","depends_on_data_domains":["DD-09"],"source":"deck","ready":true,"blocking":[],"explain":{"title":"AI-01 data readiness","lines":[{"label":"DD-09 Employee & Identity","value":"74 ≥ 60"}],"result":"Ready","rule":"Ready o // ---------------------------------------------------------------- SVG helpers
function donut(segs, size = 150) {
  const r = 58, cx = size / 2, cy = size / 2, circ = 2 * Math.PI * r, tot = segs.reduce((a, s) => a + s.v, 0) || 1;
  let off = 0;
  const arcs = segs.map((s) => { const len = (s.v / tot) * circ; const a = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="24" stroke-dasharray="${Math.max(0, len - 2)} ${circ}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(s.label)}: ${s.v}</title></circle>`; off += len; return a; });
  return `<svg width="${size}" height="${size}">${arcs.join('')}<text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">${tot}</text><text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="10" fill="${C.slate}">apps</text></svg>`;
}
function scatter({ pts, xd, yd, xt, yt, xl, yl, w = 640, h = 360, extra = '' }) {
  const m = { l: 44, r: 16, t: 20, b: 36 };
  const X = (v) => m.l + ((v - xd[0]) / (xd[1] - xd[0])) * (w - m.l - m.r);
  const Y = (v) => h - m.b - ((v - yd[0]) / (yd[1] - yd[0])) * (h - m.t - m.b);
  const grid = xt.map((t) => `<line x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${h - m.b}" stroke="${C.grid}"/><text x="${X(t)}" y="${h - m.b + 14}" font-size="11" text-anchor="middle" fill="${C.slate}">${t}</text>`).join('')
    + yt.map((t) => `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${C.grid}"/><text x="${m.l - 8}" y="${Y(t) + 4}" font-size="11" text-anchor="end" fill="${C.slate}">${t}</text>`).join('');
  const dots = pts.map((p) => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r || 6}" fill="${p.c}" fill-opacity=".88" stroke="#fff" stroke-width="1.5" ${p.click ? `data-pick="${p.click}" style="cursor:pointer"` : ''}><title>${esc(p.t)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${grid}${extra ? extra(X, Y, m, w, h) : ''}${dots}
  <text x="${(m.l + w - m.r) / 2}" y="${h - 4}" font-size="11" text-anchor="middle" fill="${C.slate}">${xl}</text>
  <text transform="translate(12 ${(m.t + h - m.b) / 2}) rotate(-90)" font-size="11" text-anchor="middle" fill="${C.slate}">${yl}</text></svg>`;
}
function hbars(rows, max, ref) {
  return `<div style="position:relative">${rows.map((r) => `<div style="display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;margin:5px 0" title="${esc(r.t || '')}">
  <span class="sm trunc r">${esc(r.l)}</span><div style="position:relative;height:18px;background:${C.grid}55;border-radius:4px">

}

// ---------------------------------------------------------------- flow diagram (HTML nodes over SVG edges)
function flow(spec) { FLOWS.push(spec); return `<div class="flow" data-flow="${FLOWS.length - 1}"></div>`; }
function drawFlows() {
  document.querySelectorAll('[data-flow]').forEach((el) => {
    const sp = FLOWS[+el.dataset.flow];
    const W = el.clientWidth, n = sp.columns.length, nodeH = sp.nodeH || 36, gap = sp.gap || 8, head = 26;
    const colGap = n > 1 ? Math.max(36, Math.min(100, W * 0.06)) : 0, colW = (W - colGap * (n - 1)) / n;
    const pos = {};
    sp.columns.forEach((c, i) => c.nodes.forEach((nd, j) => { pos[nd.id] = { x: i * (colW + colGap), y: head + j * (nodeH + gap), col: i }; }));
    const H = Math.max(sp.minH || 0, head + Math.max(0, ...sp.columns.map((c) => c.nodes.length)) * (nodeH + gap));
    el.style.height = H + 'px';
    const path = (e) => {
      const a = pos[e.from], b = pos[e.to]; if (!a || !b) return '';
      const ya = a.y + nodeH / 2, yb = b.y + nodeH / 2;
      if (a.col === b.col) { const x = a.x + colW, bu = 26 + Math.abs(yb - ya) * 0.15; return `M ${x} ${ya} C ${x + bu} ${ya}, ${x + bu} ${yb}, ${x} ${yb}`; }
      const fwd = a.col < b.col, x1 = fwd ? a.x + colW : a.x, x2 = fwd ? b.x : b.x + colW, dx = Math.abs(x2 - x1) * 0.5;
      return `M ${x1} ${ya} C ${x1 + (fwd ? dx : -dx)} ${ya}, ${x2 + (fwd ? -dx : dx)} ${yb}, ${x2} ${yb}`;
    };
    el.innerHTML = `<svg width="${W}" height="${H}">${sp.edges.map((e, i) => `<path data-e="${i}" d="${path(e)}" fill="none" stroke="${e.color || C.slate}" stroke-width="${e.w || 1.4}" ${e.dashed ? 'stroke-dasharray="4 3"' : ''} opacity=".55"><title>${esc(e.title || '')}</title></path>`).join('')}</svg>`
      + sp.columns.map((c, i) => `<div class="fcol" style="left:${i * (colW + colGap)}px;width:${colW}px;color:${c.color || C.slate}">${esc(c.title)}</div>`).join('')
      + sp.columns.flatMap((c) => c.nodes).map((nd) => { const p = pos[nd.id]; return `<button class="fnode" data-node="${esc(nd.id)}" title="${esc(nd.title || nd.label)}" style="left:${p.x}px;top:${p.y}px;width:${colW}px;height:${nodeH}px;border-left-color:${nd.color || C.navy};${nd.dashed ? 'border-style:dashed;border-left-style:solid;' : ''}${nd.sel ? `box-shadow:0 0 0 2px ${tint(C.navy, 0.35)};` : ''}">
        <span style="min-width:0;flex:1"><b>${esc(nd.label)}</b>${nd.sub ? `<small>${esc(nd.sub)}</small>` : ''}</span>${nd.badge || ''}</button>`; }).join('');
    const nodes = el.querySelectorAll('.fnode'), paths = el.querySelectorAll('path');
    const focus = (id) => {
      const linked = new Set([id]); sp.edges.forEach((e) => { if (e.from === id) linked.add(e.to); if (e.to === id) linked.add(e.from); });
      nodes.forEach((n) => n.classList.toggle('dim', id != null && !linked.has(n.dataset.node)));
      paths.forEach((p) => { const e = sp.edges[+p.dataset.e]; const on = id == null || e.from === id || e.to === id; p.setAttribute('opacity', id == null ? '.55' : on ? '.95' : '.06'); p.setAttribute('stroke-width', (e.w || 1.4) * (id != null && on ? 1.7 : 1)); });
    };
    nodes.forEach((n) => { n.addEventListener('mouseenter', () => focus(n.dataset.node)); n.addEventListener('mouseleave', () => focus(sp.sticky ?? null)); n.addEventListener('click', () => { if (sp.onPick) sp.onPick(n.dataset.node); else { sp.sticky = sp.sticky === n.dataset.node ? null : n.dataset.node; focus(sp.sticky); } }); });
  });
}

// ---------------------------------------------------------------- DASHBOARD
function admWheel(nodes) {
  const cx = 185, cy = 215, R = 118, ang = { A: -90, B: -45, C: 0, D: 45, E: 90, F: 135, G: 180, H: 225 };
  const P = {}; Object.entries(ang).forEach(([k, a]) => { P[k] = [cx + R * Math.cos((a * Math.PI) / 180), cy + R * Math.sin((a * Math.PI) / 180)]; });
  P.PRELIM = [cx, cy - R - 70]; P.REQ = [cx, cy];
  const sub = { PRELIM: 'Preliminary', A: 'Vision', B: 'Business', C: 'Info Systems', D: 'Technology', E: 'Opportunities', F: 'Migration', G: 'Governance', H: 'Change', REQ: 'Requirements Management' };
  const spokes = Object.keys(ang).map((k) => `<line x1="${cx}" y1="${cy}" x2="${P[k][0]}" y2="${P[k][1]}" stroke="${C.grid}" stroke-dasharray="3 3"/>`).join('');
  const circles = nodes.map((n) => {
    const [x, y] = P[n.phase], [col] = ADM[n.status], r = n.phase === 'REQ' ? 46 : 32;
    const lbl = n.phase === 'REQ' ? `<text x="${x}" y="${y - 2}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${C.navy}">Requirements</text><text x="${x}" y="${y + 11}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${C.navy}">Management</text>`
      : `<text x="${x}" y="${y + 3}" text-anchor="middle" font-size="17" font-weight="700" fill="${C.navy}">${n.phase === 'PRELIM' ? 'P' : n.phase}</text><text x="${x}" y="${y + 17}" text-anchor="middle" font-size="8.5" fill="${C.slate}">${sub[n.phase]}</text>`;
    EX.push(n.explain);
    return `<g data-go="${n.screen}" style="cursor:pointer"><title>${esc(n.label)}: ${ADM[n.status][1]}</title><circle cx="${x}" cy="${y}" r="${r}" fill="${tint(col, 0.14)}" stroke="${col}" stroke-width="2"/>${lbl}</g>`;
  }).join('');
  return `<svg viewBox="0 0 370 380" style="width:370px;max-width:100%"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${C.slateL}" stroke-width="1.5"/>${spokes}
  <line x1="${cx}" y1="${P.PRELIM[1] + 32}" x2="${cx}" y2="${P.A[1] - 32}" stroke="${C.slateL}"/>${circles}</svg>
  <div class="lgd" style="justify-content:center">${Object.values(ADM).map(([c, l]) => `<span><i style="background:${tint(c, 0.3)};border:1.5px solid ${c};border-radius:50%"></i>${l}</span>`).join('')}</div>`;
}

function overview() {

      ${kpi('Avg capability maturity', `${d.kpis.avg_cap_maturity.toFixed(2)}<small> / 5</small>`, `${d.counts.capabilities} L2 capabilities · Phase B`, mb(d.kpis.avg_cap_maturity, 5), d.explain.avg_cap_maturity)}

    + `<div class="g12" id="sv-adm"><div class="c5">${card(`ADM cycle ${ex(d.explain.adm)}`, 'Assessment status by phase. Select a phase to open its view.', `<div style="display:flex;flex-direction:column;align-items:center;gap:6px">${admWheel(d.adm)}</div>`, { style: 'height:100%' })}</div>

        ${card(`Transition waves to 2030 ${ex(d.explain.waves)}`, 'Initiatives sequenced by priority and dependency · §28, §36.2.14', `<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">${d.waves.map((w, i) => `<div class="card" style="padding:10px" data-go="roadmap"><div style="display:flex;justify-content:space-between"><b style="color:${WAVE[i]};font-size:12px">${w.id}</b><span class="xs mut">${w.window}</span></div><div style="font-weight:600">${w.name}</div>

function gauge(score, counts) {

    <text x="100" y="88" text-anchor="middle" font-size="34" font-weight="700" fill="${C.navy}">${score ?? '–'}</text><text x="100" y="108" text-anchor="middle" font-size="11" fill="${C.slate}">of 100 · known checks</text></svg>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px">${Object.entries(CHECK).map(([k, [c, l]]) => `<div class="card" style="padding:5px"><div class="num" style="font-size:18px;font-weight:600;color:${c}">${counts[k] || 0}</div><div class="xs mut">${l}</div></div>`).join('')}</div>
    <p class="xs mut">Pass 100 · partial 50 · fail 0. Unknown checks are excluded and become “Validate in discovery” gaps.</p></div>`;
}

function radar(acmm) {
  const n = acmm.length, cx = 170, cy = 150, R = 105, pt = (i, v) => { const a = (i / n) * Math.PI * 2 - Math.PI / 2; return [cx + (R * v / 5) * Math.cos(a), cy + (R * v / 5) * Math.sin(a)]; };
  const rings = [1, 2, 3, 4, 5].map((l) => `<polygon points="${acmm.map((_, i) => pt(i, l).join(',')).join(' ')}" fill="none" stroke="${C.grid}"/>`).join('');
  const axes = acmm.map((e, i) => { const [x, y] = pt(i, 6.4); const anc = Math.abs(x - cx) < 8 ? 'middle' : x > cx ? 'start' : 'end'; return `<line x1="${cx}" y1="${cy}" x2="${pt(i, 5)[0]}" y2="${pt(i, 5)[1]}" stroke="${C.grid}"/><text x="${x}" y="${y + 3}" font-size="9" text-anchor="${anc}" fill="${C.slate}">${esc(e.name.length > 18 ? e.name.slice(0, 17) + '…' : e.name)}</text>`; }).join('');
  return `<svg viewBox="-40 0 420 300" style="width:100%;height:auto">${rings}${axes}<polygon points="${acmm.map((e, i) => pt(i, e.level).join(',')).join(' ')}" fill="${tint(C.navy, 0.18)}" stroke="${C.navy}" stroke-width="2"/></svg>`;
}
